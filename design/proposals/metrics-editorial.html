<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beyond · Proposta de métricas</title><link rel="stylesheet" href="/proposals/design-system.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--color-page);color:var(--color-text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}.preview{max-width:1440px;margin:var(--space-8) auto}.section{background:#EDF1F9;position:relative;padding:var(--space-8) var(--page-gutter);isolation:isolate}.pattern{position:absolute;z-index:-1;pointer-events:none}.tl{top:0;left:0;width:102px}.tr{top:0;right:0;width:94px}.bl{bottom:0;left:0;width:155px}.br{bottom:0;right:0;width:102px}
.client-title{font-size:var(--text-card);font-weight:var(--weight-medium);letter-spacing:-.025em;line-height:1.55;text-align:center;margin:0 0 var(--space-6)}.client-title>span{display:block}.client-title em{font-weight:inherit;color:var(--color-action)}.client-title img{display:inline-block;width:64px;height:40px;object-fit:cover;border-radius:var(--radius-pill);vertical-align:middle;margin:0 var(--space-2);transform:translateY(-2px)}.client-title span:first-child img{object-position:65% 35%}.client-title span:last-child img{object-position:28% 35%}
.clients{display:grid;grid-template-columns:repeat(6,1fr);align-items:center;gap:var(--space-8);padding:var(--space-4) var(--space-6);border-radius:var(--radius-card);background:#ffffff38}.clients img{display:block;margin:auto;width:120px;max-width:100%;height:40px;object-fit:contain;filter:grayscale(1);opacity:.85}
.results{display:grid;grid-template-columns:1.9fr 1fr;align-items:center;gap:var(--space-10);margin:var(--space-8) 0}.primary{display:flex;align-items:center;gap:var(--space-8)}.primary h3{display:flex;align-items:baseline;margin:0;font-size:clamp(80px,8.5vw,var(--text-display));font-weight:var(--weight-medium);line-height:1;letter-spacing:-.065em;white-space:nowrap}.primary h3 span{color:var(--color-action);font-size:.65em;letter-spacing:-.04em}.primary p{font-size:var(--text-body);line-height:1.6;margin:0;letter-spacing:-.02em;max-width:220px}.team{margin:0}.team img{display:block;width:100%;height:180px;object-fit:cover;object-position:center 22%;border-radius:var(--radius-card)}
.supporting{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-10);margin-bottom:var(--space-8)}.supporting article:nth-child(2){justify-self:center}.supporting article:last-child{justify-self:end}.supporting h3{font-size:var(--text-subheading);font-weight:var(--weight-medium);line-height:1.15;letter-spacing:var(--tracking-subheading);margin:0 0 var(--space-2)}.supporting h3 span{color:var(--color-action);font-size:.75em;margin-left:var(--space-1)}.supporting p{font-size:var(--text-small);line-height:1.6;letter-spacing:-.02em;color:var(--color-text-subtle);margin:0}
.press{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-4) var(--space-6);background:#ffffff38;border-radius:var(--radius-card)}.press h2{font-size:var(--text-small);font-weight:var(--weight-regular);color:var(--color-text-subtle);margin:0;white-space:nowrap}.logos{display:flex;align-items:center;justify-content:space-around;gap:var(--space-8);flex:1}.logos img{width:96px;height:32px;object-fit:contain;opacity:.75;filter:grayscale(1)}.logos img:last-child{width:120px}.press a{font-size:var(--text-small);text-decoration:none;color:var(--color-action);white-space:nowrap;font-weight:var(--weight-medium)}.press a span{margin-left:var(--space-2)}.press a:hover{text-decoration:underline}.press a:focus-visible{outline:2px solid var(--color-focus);outline-offset:4px}
@media(max-width:1050px){.results{grid-template-columns:1.8fr 1fr;gap:var(--space-6)}.primary{gap:var(--space-4)}.primary h3{font-size:88px}.primary p{font-size:var(--text-small)}.team img{height:150px}.supporting{gap:var(--space-6)}.supporting p{font-size:var(--text-small)}.press{gap:var(--space-4)}.logos{gap:var(--space-4)}.logos img{width:64px}.logos img:last-child{width:90px}}
@media(max-width:700px){.preview{margin:var(--space-4) auto}.section{padding:var(--space-8) 20px}.client-title{font-size:var(--text-card)}.client-title img{width:48px;height:32px;margin-inline:var(--space-1)}.clients{grid-template-columns:repeat(3,1fr);gap:var(--space-6);padding:var(--space-4)}.clients img{height:28px}.results{grid-template-columns:1fr;gap:var(--space-6);margin-block:var(--space-6)}.primary{display:block}.primary h3{font-size:72px;letter-spacing:var(--tracking-heading)}.primary p{font-size:var(--text-small);margin-top:var(--space-3);max-width:none}.primary p br{display:none}.team img{height:160px}.supporting{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);margin-bottom:var(--space-6)}.supporting article:nth-child(2),.supporting article:last-child{justify-self:stretch}.supporting h3{font-size:clamp(24px,7vw,36px);letter-spacing:-.05em}.supporting p{font-size:12px;line-height:1.5}.supporting p br{display:none}.press{flex-wrap:wrap;gap:var(--space-4);padding:var(--space-4)}.press h2{flex:1}.press a{order:1;font-size:12px}.logos{order:2;flex-basis:100%;gap:var(--space-4)}.logos img,.logos img:last-child{width:calc((100% - 48px)/4);height:28px}}
